# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - mycoffeapi

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      # O package-lock.json é gerado com npm 11 (Node 24 local); o npm 10 do Node 22
      # recusa esse lock no `npm ci` ("Missing: webpack ... from lock file").
      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install, build and unit test
        run: |
          npm ci
          npm run build
          npm test

      # Envia só o necessário para rodar: JS compilado + dependências de produção.
      # Sem isso o App Service recebia o projeto inteiro e recompilava o TypeScript a cada início.
      - name: Prepare production package
        run: |
          npm prune --omit=dev
          zip -qr release.zip dist node_modules package.json package-lock.json

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mycoffeapi'
          slot-name: 'Production'
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D97489D860284663BCFC8EFA758AF35A }}
